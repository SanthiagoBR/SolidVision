# The checks of every push and pull request (RFC-049). Each job calls one
# group of scripts/check.py, and nothing else: the list of checks lives only
# there (RFC-048). The backend suite joins in RFC-050.
#
# Every action is pinned by its commit, with the tag beside it, and comes from
# the `actions` organization (RFC-049 section 4.5). Updating one is changing
# the commit by hand. backend/tests/test_ci_workflow.py refuses a tag.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Ubuntu's own Python: the frontend's part of check.py needs only the
      # standard library (RFC-048 section 4.3).
      - run: python3 scripts/check.py frontend

  estatico:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # Also check.py's PYTHON_VERSION: the env step fails if the two disagree.
      PYTHON_VERSION: "3.12.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The whole venv, not pip's cache (RFC-049 section 2.4). Saved apart,
      # right after make_venv.py has held it against the lockfiles, so a run
      # whose checks fail still keeps it (section 4.4).
      - id: venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-${{ env.PYTHON_VERSION }}-${{ hashFiles('scripts/python-win-64.lock', 'scripts/python-dev-win-64.lock', 'scripts/make_venv.py') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python scripts/make_venv.py
      - if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: ${{ steps.venv.outputs.cache-primary-key }}
      # One entry per commit; each run restores the newest with the same
      # lockfiles. Saved whether mypy passed or not.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('scripts/python-win-64.lock', 'scripts/python-dev-win-64.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('scripts/python-win-64.lock', 'scripts/python-dev-win-64.lock') }}-
      # The venv's Python by its path, never a `python` from PATH (RFC-048
      # section 17.12).
      - run: .\.venv\Scripts\python.exe scripts/check.py python
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('scripts/python-win-64.lock', 'scripts/python-dev-win-64.lock') }}-${{ github.sha }}
