[project]
name = "solidvision"
version = "0.1.0"
description = "SolidVision backend development environment"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
  | alembic
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true
show-fixes = true
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "dataset_tools"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["backend/app", "backend/tests", "backend/dataset_tools"]

# langdetect ships no type information and has no stubs on typeshed.
# Scoped to that one module so the rest of the codebase stays strict --
# torch and transformers both ship `py.typed` and are checked normally.
[[tool.mypy.overrides]]
module = ["langdetect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not slow'"
pythonpath = [".", "backend"]
markers = [
    # Opt-in only: downloads and runs the real Hugging Face checkpoints
    # (RFC-023 section 15). Deselected by the default `addopts` above, so
    # a plain `pytest` stays offline, fast, and deterministic. Run them
    # with `pytest -m slow` or `pytest -m ""`.
    "slow: requires downloading and running real AI models",
]
