depth = 2

[[root]]
category = "Aerial photographs of farms"
depth = 2

[[root]]
category = "Aerial photographs of agriculture"
depth = 2

[[root]]
category = "Aerial photographs of forests"
depth = 2

[[root]]
category = "Aerial photographs of construction sites"
depth = 2

[[root]]
category = "Aerial photographs of quarries"
depth = 2

[[root]]
category = "Aerial photographs of villages"
