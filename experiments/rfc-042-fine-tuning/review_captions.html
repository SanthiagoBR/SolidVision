<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legendas RFC-042</title>
<style>
:root {
  --bg: #f5f5f2;
  --panel: #ffffff;
  --text: #1d1d1b;
  --muted: #66665f;
  --line: #dcdcd4;
  --accent: #3949ab;
  --accent-text: #ffffff;
  --chip: #eceef8;
  --error: #b3261e;
  --ok: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514;
    --panel: #1f1f1d;
    --text: #ececea;
    --muted: #a5a59e;
    --line: #34342f;
    --accent: #8c9eff;
    --accent-text: #10122a;
    --chip: #2a2d42;
    --error: #f28b82;
    --ok: #81c995;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
h1 { margin: 0; font-size: 15px; font-weight: 600; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
button {
  font: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"], button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}
kbd { font: 12px ui-monospace, monospace; opacity: 0.75; margin-left: 4px; }
input[type="search"], textarea {
  font: inherit;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 9px;
  width: 100%;
}
input[type="search"] { width: auto; flex: 1 1 180px; max-width: 320px; }
textarea { resize: vertical; }
input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#stats { margin-left: auto; color: var(--muted); font-size: 13px; }
main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
}
#stage {
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
#photo { width: 100%; height: 100%; object-fit: contain; }
#empty { max-width: 460px; color: var(--muted); text-align: center; }
aside {
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  background: var(--panel);
  border-left: 1px solid var(--line);
}
#title { color: var(--accent); font-weight: 600; word-break: break-word; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  background: var(--chip);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 12px;
}
label.field { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
fieldset { border: 0; padding: 0; margin: 8px 0 0; }
legend { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.option {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 0 10px 4px 0;
  font-size: 14px;
  cursor: pointer;
}
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
#status { min-height: 1.4em; font-size: 14px; color: var(--ok); }
#status.error { color: var(--error); }
[hidden] { display: none !important; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  #stage { height: 55vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  #stats { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>Legendas · RFC-042</h1>
  <div class="modes" role="group" aria-label="Modo">
    <button type="button" data-mode="write">Escrever legendas</button>
    <button type="button" data-mode="review">Revisar VLM</button>
    <button type="button" data-mode="queries">Consultas de avaliação</button>
  </div>
  <input id="filter" type="search" placeholder="Filtrar: street, Brazil, lake…"
         aria-label="Filtrar fotos por título, descrição ou categoria">
  <span id="stats"></span>
</header>
<main>
  <div id="stage">
    <img id="photo" alt="" hidden>
    <p id="empty" hidden></p>
  </div>
  <aside>
    <div id="details" hidden>
      <p><a id="title" target="_blank" rel="noopener noreferrer"></a></p>
      <p id="description" class="small"></p>
      <p id="meta" class="small muted"></p>
      <div id="categories" class="chips"></div>
    </div>
    <div id="form" hidden>
      <section data-for="write">
        <label class="field" for="caption">Legenda de treino, em inglês</label>
        <textarea id="caption" rows="5"></textarea>
        <p class="hint">Descreva o que se vê: a cena, os elementos, o ângulo. Uma ou duas frases.
          O título e a descrição do Commons são só contexto.</p>
        <fieldset id="focus"><legend>Foco desta legenda</legend></fieldset>
      </section>
      <section data-for="review">
        <label class="field" for="reviewed">Legenda do VLM: corrija o que estiver errado</label>
        <textarea id="reviewed" rows="6"></textarea>
        <p class="hint" id="vlm-model"></p>
      </section>
      <section data-for="queries">
        <label class="field" for="query-pt">Consulta em português</label>
        <textarea id="query-pt" rows="2"></textarea>
        <label class="field" for="query-en" style="margin-top: 10px">
          Consulta em inglês (opcional)</label>
        <textarea id="query-en" rows="2"></textarea>
        <p class="hint">Escreva como alguém buscaria esta foto no app. Ela e a série dela
          (mesmo autor, mesmo dia) ficam fora do treino.</p>
      </section>
    </div>
    <div class="actions" id="actions" hidden>
      <button type="button" id="save" class="primary">Salvar<kbd>Ctrl+Enter</kbd></button>
      <button type="button" id="reject" data-for="review">Rejeitar</button>
      <button type="button" id="skip">Pular<kbd>Esc</kbd></button>
      <button type="button" id="back">Voltar</button>
    </div>
    <p id="status" role="status"></p>
    <p id="remaining" class="small muted"></p>
  </aside>
</main>
<script>
"use strict";

const FOCUS = [
  ["street", "Rua"],
  ["urban", "Paisagem urbana"],
  ["negation", "Negação"],
  ["rural", "Rural"],
  ["other", "Outro"],
];
const VERDICTS = { approved: "aprovada", edited: "corrigida", rejected: "rejeitada" };
const MODE_KEY = "rfc042-review-mode";
const $ = (id) => document.getElementById(id);

let mode = readMode();
let current = null;
let busy = false;
let lastFocus = "other";
const visited = [];

function readMode() {
  try {
    const saved = localStorage.getItem(MODE_KEY);
    if (saved === "write" || saved === "review" || saved === "queries") {
      return saved;
    }
  } catch (error) {
    // Storage blocked: start in the first mode.
  }
  return "write";
}

function storeMode() {
  try {
    localStorage.setItem(MODE_KEY, mode);
  } catch (error) {
    // Only a convenience.
  }
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  let data = {};
  try {
    data = await response.json();
  } catch (error) {
    // An empty or non-JSON answer; the status says enough.
  }
  if (!response.ok) {
    throw new Error(data.error || `HTTP ${response.status}`);
  }
  return data;
}

function setStatus(text, isError) {
  const status = $("status");
  status.textContent = text;
  status.classList.toggle("error", Boolean(isError));
}

function showMode() {
  for (const button of document.querySelectorAll(".modes button")) {
    button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
  }
  for (const element of document.querySelectorAll("[data-for]")) {
    element.hidden = element.dataset.for !== mode;
  }
}

async function setMode(next) {
  mode = next;
  storeMode();
  visited.length = 0;
  showMode();
  setStatus("");
  await loadNext();
}

function filterText() {
  return $("filter").value.trim();
}

async function loadNext() {
  try {
    const params = new URLSearchParams({ mode, q: filterText() });
    render(await api(`/api/next?${params}`));
  } catch (error) {
    setStatus(error.message, true);
  }
}

function render(data) {
  current = data.item;
  const showing = Boolean(current);
  $("photo").hidden = !showing;
  $("details").hidden = !showing;
  $("form").hidden = !showing;
  $("actions").hidden = !showing;
  $("empty").hidden = showing;
  if (!showing) {
    $("empty").textContent = data.message;
    $("remaining").textContent = "";
    return;
  }
  $("remaining").textContent = `${data.remaining} foto(s) disponíveis neste modo`;
  $("photo").src = current.image;
  $("photo").alt = current.title;
  $("title").textContent = current.title;
  $("title").href = current.source_url;
  $("description").textContent = current.description || "(sem descrição no Commons)";
  $("meta").textContent = [current.license, current.author].filter(Boolean).join(" · ");
  const list = $("categories");
  list.replaceChildren();
  for (const name of current.categories) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = name;
    list.append(chip);
  }

  const saved = current.saved;
  if (mode === "write") {
    $("caption").value = saved ? saved.text : "";
    pickFocus(saved ? saved.focus : lastFocus);
    $("caption").focus();
  } else if (mode === "review") {
    const vlm = current.vlm || { text: "", model: "?" };
    const keep = saved && saved.verdict !== "rejected";
    $("reviewed").value = keep ? saved.text : vlm.text;
    const before = saved ? ` Revisão anterior: ${VERDICTS[saved.verdict]}.` : "";
    $("vlm-model").textContent = `Gerada por ${vlm.model}.${before}`;
    $("reviewed").focus();
  } else {
    $("query-pt").value = saved ? saved.pt : "";
    $("query-en").value = saved ? saved.en : "";
    $("query-pt").focus();
  }
}

function buildFocus() {
  const group = $("focus");
  for (const [value, label] of FOCUS) {
    const option = document.createElement("label");
    option.className = "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "focus";
    input.value = value;
    input.addEventListener("change", () => {
      lastFocus = value;
    });
    option.append(input, document.createTextNode(label));
    group.append(option);
  }
}

function pickFocus(value) {
  for (const input of document.querySelectorAll('input[name="focus"]')) {
    input.checked = input.value === value;
  }
}

function chosenFocus() {
  const input = document.querySelector('input[name="focus"]:checked');
  return input ? input.value : null;
}

async function save(reject) {
  if (!current || busy) {
    return;
  }
  const body = { mode, pageid: current.pageid };
  if (mode === "write") {
    body.text = $("caption").value;
    body.focus = chosenFocus();
  } else if (mode === "review") {
    body.text = $("reviewed").value;
    body.reject = Boolean(reject);
  } else {
    body.pt = $("query-pt").value;
    body.en = $("query-en").value;
  }
  busy = true;
  try {
    const result = await api("/api/save", body);
    visited.push(current.pageid);
    showStats(result.stats);
    await loadNext();
    setStatus(result.deleted ? "Apagada." : "Salva.");
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    busy = false;
  }
}

async function skip() {
  if (!current || busy) {
    return;
  }
  busy = true;
  try {
    await api("/api/skip", { mode, pageid: current.pageid, q: filterText() });
    visited.push(current.pageid);
    await loadNext();
    setStatus("Pulada.");
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    busy = false;
  }
}

async function back() {
  if (busy || visited.length === 0) {
    return;
  }
  const pageid = visited.pop();
  try {
    const params = new URLSearchParams({ mode, pageid: String(pageid) });
    render(await api(`/api/item?${params}`));
    setStatus("Foto anterior. Para corrigir, edite e salve de novo.");
  } catch (error) {
    setStatus(error.message, true);
  }
}

function showStats(stats) {
  const parts = [`${stats.photos} fotos`, `${stats.captions} legendas à mão`];
  if (stats.vlm) {
    const rate = stats.error_rate === null
      ? "sem revisões"
      : `${Math.round(stats.error_rate * 100)}% com erro`;
    parts.push(`${stats.reviews} de ${stats.review_target} revisões (${rate})`);
  }
  parts.push(`${stats.queries} consultas`);
  $("stats").textContent = parts.join(" · ");
}

async function loadStats() {
  try {
    showStats(await api("/api/stats"));
  } catch (error) {
    setStatus(error.message, true);
  }
}

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    save(false);
  } else if (event.key === "Escape" && event.target !== $("filter")) {
    event.preventDefault();
    skip();
  }
});

let filterTimer = 0;
$("filter").addEventListener("input", () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    visited.length = 0;
    loadNext();
  }, 400);
});

buildFocus();
for (const button of document.querySelectorAll(".modes button")) {
  button.addEventListener("click", () => setMode(button.dataset.mode));
}
$("save").addEventListener("click", () => save(false));
$("reject").addEventListener("click", () => save(true));
$("skip").addEventListener("click", skip);
$("back").addEventListener("click", back);
showMode();
loadStats();
loadNext();
</script>
</body>
</html>
