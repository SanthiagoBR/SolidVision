services:
  postgres:
    # A fixed tag, never `pg16`: the floating one moves on every pgvector
    # release. 16 and 0.8.6 are what the installer embeds (RFC-033a, ADR-008).
    image: pgvector/pgvector:0.8.6-pg16
    container_name: solidvision-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      # Read only when the volume is created. UTF8 and C on both sides
      # (RFC-033a section 5).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      # Named after the major version. The 17 volume, `postgres_data`, is
      # left intact as the way back (RFC-033a section 7).
      - postgres_data_pg16:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solidvision_network

volumes:
  postgres_data_pg16:
    driver: local

networks:
  solidvision_network:
    driver: bridge
