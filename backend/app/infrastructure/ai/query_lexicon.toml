# ---------------------------------------------------------------- nomes próprios
#
# Place names that begin with a form the lexicon replaces. The longest match
# takes them whole, so they go to Marian as typed: "fazenda no Mato Grosso"
# is *farm in Mato Grosso*, and would be *farm in the Grosso Vegetation*
# with "mato" replaced (RFC-047 section 11, risk 2). A name is the same in
# both languages, so none of them is a Portuguese marker. Only names a troca
# was measured to break are here: "Morro de São Paulo" is better with it
# (*Hill of São Paulo* against *Death of São Paulo*).

[[forma]]
pt = "Mato Grosso"
en = ["mato grosso"]
origem = "geral"
tambem_ingles = true

[[forma]]
pt = "Foz do Iguaçu"
en = ["foz do iguaçu"]
origem = "geral"
tambem_ingles = true

[[forma]]
pt = "Capão da Canoa"
en = ["capão da canoa"]
origem = "sul"
tambem_ingles = true

