# The query lexicon of RFC-047: Portuguese forms of things seen in aerial
# photos, each with the English its translation must produce.
#
# One form per entry, as typed: no plural or inflection rule, so the plural
# that matters is an entry of its own. Matching ignores case and accents
# ("galpao" is "galpão"), so a form needs no unaccented twin; what goes to
# the translator is the accented form, or `troca` when there is one.
#
#   pt            the form
#   en            what counts as a right translation: the translation of what
#                 goes to Marian must contain one of these, as whole words
#   troca         only when Marian gets the form wrong: the Portuguese sent
#                 in its place. Every one is checked by the slow tests, and
#                 chosen by experiments/rfc-047-traducao-das-consultas/
#                 probe_lexicon.py
#   origem        "geral" or "sul" (the south of Brazil)
#   tambem_ingles true for a form that is an English word too ("hotel"):
#                 it is then never a Portuguese marker (RFC-047 section 6)
#
# A new form goes through the probe and the slow tests. Nothing enters
# because it failed on an evaluation query (RFC-047 section 4.4).

